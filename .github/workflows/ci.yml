name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  stock-screener-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stock_screener
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest
      - name: Run tests
        run: pytest -v

  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile check all Python files
        run: python -m py_compile $(git ls-files '*.py')
